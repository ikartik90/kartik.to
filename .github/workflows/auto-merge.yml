name: Auto-merge

# Arms GitHub's native auto-merge. GitHub — not this workflow — performs the
# merge, and only once every check required by the branch ruleset has reported
# success (CI's three jobs plus Vercel's own deployment check). Pushing to main
# is what triggers Vercel's production deploy, so no deploy step belongs here.
#
# WHO arms it decides who GitHub records as the merger, and that has one
# consequence worth the secret this needs. Armed with GITHUB_TOKEN, the merge
# lands as `app/github-actions`, and two things silently stop working: the
# repository's "Automatically delete head branches" setting does not fire, and
# neither does any workflow listening for the merge, because events triggered
# by GITHUB_TOKEN do not start workflow runs. That is why every merged branch
# here stayed standing and every deletion in the repository's history was done
# by hand. Arming with a PAT makes the merge the user's own, so the built-in
# deletion fires and no branch-cleanup workflow is needed at all.
#
# AUTO_MERGE_TOKEN is a fine-grained PAT scoped to this repository with
# Contents: read & write and Pull requests: read & write. PATs expire — when
# this one does, arming falls back to GITHUB_TOKEN and the job warns rather
# than failing. An unarmed pull request is a nuisance; a repository that
# cannot merge is an outage. The gate is unaffected either way: the ruleset
# has no bypass actors, so a PAT-armed merge still waits on every required
# check exactly as before.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  arm:
    name: Arm auto-merge
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          # The token itself is masked in expressions, so ask a boolean instead
          # of testing GH_TOKEN's contents in the shell.
          HAS_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::AUTO_MERGE_TOKEN is unset or expired — arming as GITHUB_TOKEN. The pull request will still merge under the same required checks, but GitHub will record the merge as app/github-actions and will NOT delete the head branch. See the comment at the top of this workflow."
          fi

          # Without required status checks there is nothing for auto-merge to
          # wait on, and GitHub merges the pull request the moment it is armed —
          # the exact opposite of a gate. Refuse to arm rather than let a
          # misconfigured branch turn this into an unconditional merge button.
          required=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$BASE" \
            --jq '[.[] | select(.type == "required_status_checks")
                       | .parameters.required_status_checks[]?.context] | length')

          if [ "$required" -eq 0 ]; then
            echo "::error::Branch '$BASE' has no required status checks, so auto-merge would merge immediately. Add a ruleset requiring the CI jobs and the Vercel check before relying on this workflow."
            exit 1
          fi

          echo "Branch '$BASE' requires $required status check(s)."

          # --repo on every `gh pr` call: this job deliberately skips checkout
          # (it needs no source), and without a local git remote to infer from,
          # gh exits with "failed to run git: not a git repository".
          if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
                    --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge is already armed on #$PR."
            exit 0
          fi

          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --auto
          echo "Armed auto-merge on #$PR — it will merge once every required check is green."
